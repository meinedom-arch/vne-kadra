<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Вне кадра — энциклопедия, задания и идеи для мобильного фотографа."
  />

  <meta name="theme-color" content="#11100f" />
  <meta name="color-scheme" content="dark light" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta
    name="apple-mobile-web-app-title"
    content="Вне кадра"
  />

  <link rel="manifest" href="./manifest.json" />
  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  />
  <link rel="stylesheet" href="./styles.css" />

  <title>Вне кадра</title>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <button
        class="brand-button"
        type="button"
        data-screen="today"
        aria-label="Перейти на главную"
      >
        <span class="eyebrow">
          МОБИЛЬНАЯ ФОТОГРАФИЯ
        </span>

        <span class="brand">
          Вне кадра
        </span>
      </button>

      <div class="topbar-actions">
        <button
          class="install-button hidden"
          id="installButton"
          type="button"
        >
          Установить
        </button>

        <button
          class="icon-button"
          id="themeToggle"
          type="button"
          aria-label="Переключить тему"
          title="Переключить тему"
        >
          ◐
        </button>
      </div>
    </header>

    <main
      id="app"
      class="main-content"
    ></main>

    <nav
      class="bottom-nav"
      aria-label="Основная навигация"
    >
      <button
        class="nav-item active"
        type="button"
        data-screen="today"
      >
        <span class="nav-icon">◉</span>
        <span>Сегодня</span>
      </button>

      <button
        class="nav-item"
        type="button"
        data-screen="learn"
      >
        <span class="nav-icon">▤</span>
        <span>Изучать</span>
      </button>

      <button
        class="nav-item nav-item-main"
        type="button"
        data-screen="shoot"
      >
        <span class="shoot-icon">＋</span>
        <span>Снять</span>
      </button>

      <button
        class="nav-item"
        type="button"
        data-screen="collection"
      >
        <span class="nav-icon">♡</span>
        <span>Коллекция</span>
      </button>

      <button
        class="nav-item"
        type="button"
        data-screen="profile"
      >
        <span class="nav-icon">○</span>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <div
    id="sheetBackdrop"
    class="sheet-backdrop hidden"
    aria-hidden="true"
  >
    <section
      id="bottomSheet"
      class="bottom-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
    >
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div>
          <p class="sheet-eyebrow">
            НАСТРОЙКА
          </p>

          <h2 id="sheetTitle">
            Выбор
          </h2>
        </div>

        <button
          class="sheet-close"
          id="sheetClose"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>
      </div>

      <div
        id="sheetContent"
        class="sheet-content"
      ></div>
    </section>
  </div>

  <!--
    Сначала загружается база материалов,
    затем логика приложения.
  -->
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
